<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Solana Clear Sign security pipeline</title>
  <desc id="desc">Authenticated IDL metadata, instruction bytes, and ordered accounts pass through strict validation, decoding, formatting, and sanitization. Any failure produces raw_dump.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14f195"/>
      <stop offset="1" stop-color="#9945ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7080a8"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #f4f7ff; }
      .subtitle { font-size: 16px; font-weight: 400; fill: #aab5d3; }
      .boxTitle { font-size: 17px; font-weight: 700; fill: #f4f7ff; }
      .boxText { font-size: 13px; font-weight: 400; fill: #b9c4df; }
      .small { font-size: 12px; font-weight: 600; fill: #8d9abb; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>

  <text x="64" y="70" class="title">Solana Clear Sign</text>
  <text x="64" y="101" class="subtitle">Deterministic instruction intent with a fail-closed security boundary</text>

  <g filter="url(#shadow)">
    <rect x="64" y="154" width="220" height="210" rx="16" fill="#171f39" stroke="#34415f"/>
    <text x="88" y="186" class="small">AUTHENTICATED INPUTS</text>
    <rect x="88" y="208" width="172" height="38" rx="8" fill="#202b49"/>
    <text x="104" y="232" class="boxText">IDL metadata + digest</text>
    <rect x="88" y="260" width="172" height="38" rx="8" fill="#202b49"/>
    <text x="104" y="284" class="boxText">Instruction bytes</text>
    <rect x="88" y="312" width="172" height="38" rx="8" fill="#202b49"/>
    <text x="104" y="336" class="boxText">Ordered accounts</text>
  </g>

  <path d="M284 259 H342" stroke="#7080a8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="354" y="154" width="492" height="210" rx="16" fill="#171f39" stroke="#34415f"/>
    <text x="380" y="186" class="small">DEFENSIVE ENGINE</text>
    <rect x="380" y="210" width="126" height="112" rx="12" fill="#202b49" stroke="#3b4b70"/>
    <text x="398" y="241" class="boxTitle">Validate</text>
    <text x="398" y="268" class="boxText">Strict schema</text>
    <text x="398" y="290" class="boxText">Trusted digest</text>

    <path d="M506 266 H536" stroke="#7080a8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="548" y="210" width="126" height="112" rx="12" fill="#202b49" stroke="#3b4b70"/>
    <text x="566" y="241" class="boxTitle">Decode</text>
    <text x="566" y="268" class="boxText">Exact bounds</text>
    <text x="566" y="290" class="boxText">No trailing bytes</text>

    <path d="M674 266 H704" stroke="#7080a8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="716" y="210" width="104" height="112" rx="12" fill="#202b49" stroke="#3b4b70"/>
    <text x="732" y="241" class="boxTitle">Render</text>
    <text x="732" y="268" class="boxText">Exact bigint</text>
    <text x="732" y="290" class="boxText">Safe Unicode</text>
  </g>

  <path d="M846 259 H904" stroke="#7080a8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="916" y="154" width="220" height="122" rx="16" fill="#132e2c" stroke="#14f195"/>
    <text x="940" y="187" class="small" fill="#74f7c0">SAFE DISPLAY</text>
    <text x="940" y="221" class="boxTitle">Human-readable intent</text>
    <text x="940" y="247" class="boxText">Interpolated or structured</text>
  </g>

  <path d="M600 364 V408 H906" stroke="#e45d78" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="628" y="398" class="boxText" fill="#f08aa0">Any validation, decoding, formatting, or sanitization failure</text>

  <g filter="url(#shadow)">
    <rect x="916" y="382" width="220" height="82" rx="16" fill="#361d2a" stroke="#e45d78"/>
    <text x="940" y="416" class="boxTitle">raw_dump</text>
    <text x="940" y="442" class="boxText">Never silently sign</text>
  </g>
</svg>
